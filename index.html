<!DOCTYPE html>
<html lang="es">
<head>

<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22><stop offset=%220%22 stop-color=%22%2298E4FF%22/><stop offset=%221%22 stop-color=%22%230F6FB0%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22url(%23g)%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22>💧</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap');

  :root{
    --sky-a:#EAF8FF; --sky-b:#C7EEFC; --sky-c:#86D3F2; --sky-d:#4EB3E4;
    --ink:#0B3652; --ink-muted:#4C7791; --ink-soft:#7FA6BE;
    --glass-hi:rgba(255,255,255,.92); --glass-lo:rgba(255,255,255,.46); --glass-line:rgba(255,255,255,.95);
    --blue:#1C8CD8; --blue-dk:#0B5C99; --blue-lt:#8FE0FF;
    --teal:#0FBFA6; --teal-dk:#068C79;
    --green:#4FE07E; --green-dk:#1EA85A;
    --orange:#FFA23C; --orange-dk:#E0791A;
    --red:#FF5B6E; --red-dk:#D8384E;
    --purple:#8E86F5; --purple-dk:#6459DF;
    --chrome-1:#EAF7FF; --chrome-2:#8FD3F5; --chrome-3:#2E8FCB; --chrome-4:#0A4A7D;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink);
    font-family:'Nunito',-apple-system,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:9px;
    background:linear-gradient(155deg, var(--chrome-1) 0%, var(--chrome-2) 22%, var(--chrome-3) 65%, var(--chrome-4) 100%);
    min-height:100%;
  }
  .font-display{ font-family:'Fredoka',system-ui,sans-serif; }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; -webkit-user-select:none; user-select:none; }
  input,textarea{ font-family:inherit; border:none; }
  a{ text-decoration:none; color:inherit; }

  /* ---- chrome window screen ---- */
  #screen{
    position:relative; overflow:hidden; border-radius:26px;
    min-height:calc(100vh - 18px);
    background: radial-gradient(120% 55% at 50% 0%, var(--sky-a) 0%, var(--sky-b) 42%, var(--sky-c) 76%, var(--sky-d) 100%);
    box-shadow: inset 0 2px 5px rgba(255,255,255,.8), inset 0 -2px 10px rgba(10,60,100,.12), 0 16px 36px rgba(4,35,60,.4);
    padding-bottom:118px;
  }

  /* ---- floating aero bubbles (decor) ---- */
  .bubbles{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .bubble{ position:absolute; border-radius:50%; opacity:.5;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,.15) 40%, rgba(255,255,255,0) 70%),
               radial-gradient(circle at 65% 75%, rgba(140,225,255,.35), rgba(140,225,255,0) 60%);
    box-shadow: inset 0 0 12px rgba(255,255,255,.5);
    animation: drift 22s ease-in-out infinite; }
  @keyframes drift{ 0%,100%{ transform:translateY(0) translateX(0); } 50%{ transform:translateY(-26px) translateX(10px); } }
  .sparkle{ position:absolute; color:#fff; text-shadow:0 0 6px rgba(255,255,255,.9); animation:twinkle 2.6s ease-in-out infinite; pointer-events:none; }
  @keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.8); } 50%{ opacity:1; transform:scale(1.1); } }
  @media (prefers-reduced-motion: reduce){ .bubble,.sparkle{ animation:none; } }

  main{ position:relative; z-index:1; padding:0 14px; max-width:460px; margin:0 auto; }

  /* ---- glass shared look ---- */
  .glass{
    background:linear-gradient(180deg, var(--glass-hi), var(--glass-lo));
    border:1px solid var(--glass-line);
    border-radius:22px;
    box-shadow:0 10px 26px rgba(11,54,82,.16), inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    position:relative; overflow:hidden;
  }
  .glass::before{ content:""; position:absolute; top:0; left:6%; right:6%; height:44%;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    border-radius:50% 50% 60% 60% / 100% 100% 40% 40%; pointer-events:none; }

  /* ---- header / hero ---- */
  header.app-header{ position:relative; z-index:1; padding:20px 16px 34px; margin-bottom:-22px; }
  .hdr-inner{ max-width:460px; margin:0 auto; position:relative; }
  .hdr-glass{ background:linear-gradient(160deg, rgba(255,255,255,.4), rgba(255,255,255,.1));
    border:1px solid rgba(255,255,255,.6); border-radius:28px; padding:16px 16px 18px;
    box-shadow:0 12px 30px rgba(9,60,92,.2), inset 0 1px 0 rgba(255,255,255,.65); backdrop-filter:blur(6px); position:relative; overflow:hidden; }
  .hdr-date{ display:flex; align-items:center; gap:6px; color:#0B3652; opacity:.75; font-size:11px; font-weight:800;
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .hdr-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  h1.hdr-title{ font-size:24px; font-weight:600; margin:0; color:#08324D; text-shadow:0 1px 0 rgba(255,255,255,.5); }
  .hero-orb{ flex-shrink:0; width:64px; height:56px; filter:drop-shadow(0 6px 10px rgba(9,60,92,.25)); }

  .stat-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:14px; }
  .stat-orb{ border-radius:20px; padding:10px 6px 9px; text-align:center; position:relative; overflow:hidden;
    background:linear-gradient(165deg, rgba(255,255,255,.85), rgba(255,255,255,.25));
    border:1px solid rgba(255,255,255,.7); box-shadow:0 6px 14px rgba(9,60,92,.18), inset 0 1px 0 rgba(255,255,255,.9); }
  .stat-orb::before{ content:""; position:absolute; top:2px; left:14%; right:14%; height:38%;
    background:rgba(255,255,255,.6); border-radius:50%; filter:blur(1px); }
  .stat-orb.danger{ background:linear-gradient(165deg, #FF8F9C, var(--red)); border-color:rgba(255,255,255,.5); }
  .stat-orb.danger .stat-value, .stat-orb.danger .stat-label{ color:#fff; }
  .stat-value{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:20px; line-height:1; color:#0B3652; position:relative; }
  .stat-label{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; margin-top:4px; color:#3E6A88; position:relative; }

  .week-track{ display:flex; align-items:center; gap:9px; }
  .week-track-label{ font-size:11px; font-weight:800; color:var(--blue-dk); white-space:nowrap; }
  .week-track-bar{ flex:1; height:12px; border-radius:999px; background:rgba(255,255,255,.55); box-shadow:inset 0 2px 4px rgba(9,60,92,.18); position:relative; overflow:hidden; }
  .week-track-fill{ height:100%; border-radius:999px; background:linear-gradient(180deg, #C9FBDA, var(--green) 45%, var(--green-dk));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8); position:relative; }
  .week-track-fill::after{ content:""; position:absolute; right:0; top:0; bottom:0; width:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #E7FFEF 60%, rgba(255,255,255,0) 75%); box-shadow:0 0 4px rgba(0,0,0,.15); }
  .week-track-pct{ font-family:'Fredoka',sans-serif; font-size:12px; font-weight:600; color:var(--green-dk); width:34px; text-align:right; }

  /* ---- sections ---- */
  .section{ margin-bottom:18px; }
  .section-hdr{ display:flex; align-items:center; gap:8px; margin:0 4px 9px; }
  .dot{ width:10px; height:10px; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.7); }
  .section-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; }
  .section-count{ font-size:12px; color:var(--ink-muted); font-weight:700; }

  /* ---- item cards ---- */
  .item-row{ margin-bottom:12px; }
  .item-row.done{ opacity:.55; }
  .item-card{ display:flex; align-items:stretch; }
  .item-gem{ width:10px; flex-shrink:0; border-radius:22px 0 0 22px;
    background-image:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0) 40%); }
  .item-body{ flex:1; padding:13px 13px 13px 12px; display:flex; gap:10px; min-width:0; }
  .check-btn{ margin-top:1px; flex-shrink:0; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(165deg,#fff,#DCEFF7); box-shadow:0 2px 5px rgba(9,60,92,.18), inset 0 1px 0 #fff; font-size:16px; }
  .item-main{ flex:1; min-width:0; }
  .item-tag{ display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.02em; margin-bottom:3px; }
  .item-title{ font-weight:700; font-size:15.5px; line-height:1.3; color:#0B3652; }
  .item-title.done{ text-decoration:line-through; color:var(--ink-soft); }
  .item-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .stamp{ font-family:'Fredoka',sans-serif; font-size:10.5px; font-weight:600; padding:3px 10px; border-radius:20px; display:inline-block;
    background:rgba(255,255,255,.75); box-shadow:inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.08); }
  .diff-badge{ font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
  .del-btn{ align-self:flex-start; padding:5px; color:#8FB6CC; flex-shrink:0; font-size:15px; }

  .empty{ text-align:center; padding:56px 20px 20px; position:relative; z-index:1; }
  .empty-orb{ width:84px; height:84px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:36px;
    background:radial-gradient(circle at 32% 26%, #fff, var(--blue-lt) 45%, var(--blue) 100%);
    box-shadow:0 12px 24px rgba(9,60,92,.25), inset 0 2px 3px rgba(255,255,255,.8); }
  .empty-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:18px; margin-bottom:6px; color:#0B3652; }
  .empty-text{ font-size:14px; color:var(--ink-muted); max-width:280px; margin:0 auto 20px; font-weight:600; }
  .btn-pill{ display:inline-block; padding:12px 26px; border-radius:999px; color:#fff; font-weight:800; font-size:14px;
    background:linear-gradient(180deg, var(--teal) 0%, var(--teal-dk) 100%); box-shadow:0 8px 18px rgba(6,140,121,.4), inset 0 1px 0 rgba(255,255,255,.6); }

  .toggle-completed{ font-size:12.5px; font-weight:800; color:var(--ink-muted); display:flex; align-items:center; gap:6px; margin:6px 4px 12px; }

  /* ---- calendar ---- */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin:18px 4px 12px; position:relative; z-index:1; }
  .cal-nav button{ width:38px; height:38px; border-radius:50%; background:linear-gradient(165deg,#fff,#DCEFF7);
    box-shadow:0 4px 10px rgba(9,60,92,.18), inset 0 1px 0 #fff; font-size:16px; color:var(--blue-dk); font-weight:800; }
  .cal-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px; text-transform:capitalize; color:#0B3652; }
  .cal-grid{ padding:14px; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .cal-weekdays span{ text-align:center; font-size:10px; font-weight:800; color:#5D8AA3; padding:4px 0; }
  .cal-days{ display:grid; grid-template-columns:repeat(7,1fr); row-gap:6px; }
  .cal-cell{ display:flex; flex-direction:column; align-items:center; padding:5px 0; border-radius:14px; }
  .cal-cell.selected{ background:linear-gradient(165deg, rgba(28,140,216,.18), rgba(28,140,216,.05)); }
  .cal-num{ width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:#0B3652; }
  .cal-num.today{ background:radial-gradient(circle at 32% 28%, #fff, var(--teal) 60%, var(--teal-dk)); color:#fff; font-weight:800; box-shadow:0 2px 6px rgba(6,140,121,.4); }
  .cal-num.selected{ background:radial-gradient(circle at 32% 28%, #fff, var(--blue-lt) 45%, var(--blue)); color:#fff; font-weight:800; box-shadow:0 2px 6px rgba(11,92,153,.4); }
  .cal-dots{ display:flex; gap:2px; margin-top:4px; height:6px; }
  .cal-dots span{ width:5px; height:5px; border-radius:50%; box-shadow:0 0 0 .5px rgba(255,255,255,.6); }
  .cal-day-list{ margin-top:20px; position:relative; z-index:1; }
  .cal-day-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--blue-dk); margin:0 4px 9px; text-transform:capitalize; }

  /* ---- materias ---- */
  .subject-row{ padding:13px 15px; display:flex; align-items:center; gap:11px; margin-bottom:11px; }
  .subject-swatch{ width:22px; height:22px; border-radius:50%; flex-shrink:0;
    box-shadow:inset 0 -3px 4px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.15); }
  .subject-name{ flex:1; font-weight:800; color:#0B3652; }
  .subject-count{ font-size:12px; color:#5D8AA3; font-weight:700; }

  /* ---- bottom nav (chrome transport bar) ---- */
  nav.bottomnav{ position:fixed; bottom:14px; left:14px; right:14px; z-index:30; display:flex; justify-content:center; }
  .nav-inner{ width:100%; max-width:420px; display:flex; justify-content:space-around; align-items:center; padding:7px 14px;
    background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.45));
    border:1px solid rgba(255,255,255,.9); border-radius:999px;
    box-shadow:0 14px 30px rgba(9,60,92,.3), inset 0 1px 0 rgba(255,255,255,.95);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .nav-btn{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 8px; }
  .nav-circle{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px;
    background:linear-gradient(165deg,#fff,#DCEFF7); box-shadow:0 3px 8px rgba(9,60,92,.2), inset 0 1px 0 #fff; position:relative; }
  .nav-btn.active .nav-circle{ background:radial-gradient(circle at 32% 28%, #fff, var(--blue-lt) 45%, var(--blue) 100%);
    box-shadow:0 6px 14px rgba(11,92,153,.45), inset 0 1px 0 rgba(255,255,255,.8); }
  .nav-label{ font-size:10px; font-weight:800; color:#5D8AA3; }
  .nav-btn.active .nav-label{ color:var(--blue-dk); }

  .fab{ position:fixed; bottom:104px; right:20px; width:60px; height:60px; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #B7F2E6, var(--teal) 55%, var(--teal-dk) 100%);
    color:#fff; font-size:30px; font-weight:700; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 26px rgba(6,140,121,.45), inset 0 2px 3px rgba(255,255,255,.8); z-index:40; }
  .fab::after{ content:""; position:absolute; top:9%; left:20%; width:32%; height:18%;
    background:rgba(255,255,255,.8); border-radius:50%; filter:blur(2px); transform:rotate(-18deg); }
  .fab:active{ transform:scale(.93); }

  /* ---- modal / bottom sheet ---- */
  .overlay{ position:fixed; inset:0; background:rgba(6,40,64,.45); z-index:50; display:flex; align-items:flex-end; backdrop-filter:blur(2px); }
  .sheet{ background:linear-gradient(180deg, #FDFEFF, #EAF6FB); width:100%; max-width:460px; margin:0 auto;
    border-radius:28px 28px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
    box-shadow:0 -10px 30px rgba(9,60,92,.3); border-top:1px solid rgba(255,255,255,.9); }
  .sheet-handle{ width:42px; height:5px; background:#C9E4EF; border-radius:4px; margin:0 auto 14px; }
  .sheet-hdr{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-title{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:18px; color:#0B3652; }
  .field-label{ font-size:11.5px; font-weight:800; letter-spacing:.02em; color:var(--blue-dk); margin-bottom:8px; display:flex; align-items:center; gap:5px; }
  .field-input{ width:100%; background:#fff; border:1px solid #D6ECF4; border-radius:14px; padding:12px 14px; font-size:15px; margin-bottom:16px;
    outline:none; font-weight:600; color:#0B3652; box-shadow:inset 0 2px 4px rgba(9,60,92,.06); }
  .field-input:focus{ box-shadow:0 0 0 3px rgba(28,140,216,.28); border-color:var(--blue); }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip{ padding:9px 15px; border-radius:999px; font-size:13px; font-weight:800; background:#fff; color:#3E6A88;
    border:1px solid #D6ECF4; box-shadow:0 2px 4px rgba(9,60,92,.08); transition:transform .1s; }
  .chip:active{ transform:scale(.95); }
  .chip.active{ color:#fff; border-color:transparent; box-shadow:0 4px 10px rgba(9,60,92,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  .color-grid{ display:grid; grid-template-columns:repeat(8,1fr); gap:9px; margin-bottom:20px; }
  .color-swatch{ width:100%; aspect-ratio:1; border-radius:50%; box-shadow:inset 0 -3px 4px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.6); }
  .btn-row{ display:flex; gap:10px; }
  .btn-secondary{ flex:1; padding:13px; border-radius:16px; background:#E4F2F8; color:#3E6A88; font-weight:800; font-size:14px; }
  .btn-primary{ flex:1; padding:13px; border-radius:16px; color:#fff; font-weight:800; font-size:14px;
    background:linear-gradient(180deg, var(--blue) 0%, var(--blue-dk) 100%); box-shadow:0 8px 16px rgba(11,92,153,.4), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-primary:disabled, .btn-secondary:disabled{ opacity:.4; }
  .btn-full{ width:100%; padding:15px; border-radius:16px; color:#fff; font-weight:800; font-size:15px;
    background:linear-gradient(180deg, var(--teal) 0%, var(--teal-dk) 100%); box-shadow:0 10px 20px rgba(6,140,121,.4), inset 0 1px 0 rgba(255,255,255,.5); }

  .toast{ position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg, var(--red), var(--red-dk)); color:#fff;
    font-size:12.5px; font-weight:800; padding:9px 16px; border-radius:999px; box-shadow:0 8px 18px rgba(216,56,78,.4); z-index:60; }

  @media (max-width:340px){
    h1.hdr-title{ font-size:20px; } .stat-value{ font-size:17px; } .item-title{ font-size:14.5px; } .hero-orb{ width:52px; height:46px; }
  }
</style>
</head>
<body>
<div id="screen">
  <div class="bubbles" id="bubbles"></div>
  <div id="app"></div>
</div>

<script>
/* ---------------------------------- config ---------------------------------- */
const SUBJECT_COLORS = ["#FF6B5B","#F5A623","#3FD98A","#0FBFA6","#1C8CD8","#6459DF","#8E86F5","#EF6BA2"];
const TYPES = {
  tarea:    { label:"Tarea",    icon:"📝" },
  examen:   { label:"Examen",   icon:"📄" },
  proyecto: { label:"Proyecto", icon:"📦" },
};
const DIFFICULTY = {
  facil:   { label:"Fácil",   weight:1, color:"#3FD98A" },
  media:   { label:"Media",   weight:2, color:"#FFA23C" },
  dificil: { label:"Difícil", weight:3, color:"#FF5B6E" },
};
const DURATIONS = [
  { key:"corta", label:"Corta", hint:"~20 min" },
  { key:"media", label:"Media", hint:"~45 min" },
  { key:"larga", label:"Larga", hint:"1–2 h" },
  { key:"muy_larga", label:"Muy larga", hint:"2+ h" },
];
const MESES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const MESES_LARGO = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS_SEMANA = ["L","M","X","J","V","S","D"];
const DIAS_LARGO = ["domingo","lunes","martes","miércoles","jueves","viernes
